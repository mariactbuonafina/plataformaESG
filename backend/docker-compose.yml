# Versão 3.9 do Docker Compose
version: '3.9'

# --- INÍCIO DOS SERVIÇOS ---
services:

  # 1. SERVIÇO DE BANCO DE DADOS (PostgreSQL)
  # Este serviço se chamará 'db' dentro da rede do Docker
  db:
    image: postgres:14-alpine
    container_name: esg_db
    restart: unless-stopped
    environment:
      # Você pode mudar esses valores se quiser
      POSTGRES_USER: esg_user
      POSTGRES_PASSWORD: esg_password
      POSTGRES_DB: esg_db
    ports:
      # Mapeia a porta 5432 do seu PC para a porta 5432 do container
      - "5432:5432"
    volumes:
      # Esta linha garante que seus dados do banco não sumam
      - postgres-data:/var/lib/postgresql/data
    networks:
      # Conecta este serviço à nossa rede interna
      - plataforma-esg-network

  # 2. SERVIÇO DE BACKEND (API)
  # Este serviço se chamará 'api_esg' dentro da rede
  api_esg:
    container_name: esg_api
    restart: unless-stopped
    build:
      # --- ESTA É A CORREÇÃO PRINCIPAL ---
      # Diz ao Docker para entrar na pasta 'backend' e procurar o Dockerfile lá
      context: ./backend
      dockerfile: Dockerfile
    ports:
      # Mapeia a porta 3333 do seu PC para a porta 3333 do container
      - "3333:3333" # Mude a porta 3333 se o seu backend usar outra
    networks:
      - plataforma-esg-network
    depends_on:
      # Garante que o 'db' suba ANTES do 'api_esg'
      - db
    environment:
      # --- ESTA É A CORREÇÃO DE CONEXÃO ---
      # Força o backend a se conectar ao serviço 'db', e não 'localhost'
      DATABASE_URL: postgresql://esg_user:esg_password@db:5432/esg_db

  # 3. SERVIÇO DE FRONTEND
  # Este serviço se chamará 'frontend' dentro da rede
  frontend:
    container_name: esg_frontend
    restart: unless-stopped
    build:
      # --- ESTA É A CORREÇÃO PRINCIPAL ---
      # Diz ao Docker para entrar na pasta 'frontend' e procurar o Dockerfile lá
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      # Mapeia a porta 5173 do seu PC para a porta 5173 do container (Vite)
      - "5173:5173"
    networks:
      - plataforma-esg-network
    depends_on:
      # Garante que o 'api_esg' suba ANTES do 'frontend'
      - api_esg

# --- FIM DOS SERVIÇOS ---

# Define o volume que será usado pelo 'db'
volumes:
  postgres-data:
    driver: local

# Define a rede interna que todos os serviços usarão
networks:
  plataforma-esg-network:
    driver: bridge